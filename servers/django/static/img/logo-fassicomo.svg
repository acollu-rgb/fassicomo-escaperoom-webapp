<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 172" width="400" height="172" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Fondazione Fassicomo — Scuola Fassicomo</title>
  <desc id="logoDesc">Logo tipografico provvisorio con stemma e simbolo di terminale.</desc>

  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3320"/>
      <stop offset="1" stop-color="#05130a"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#00992b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="172" rx="12" fill="#ffffff"/>

  <!-- Stemma -->
  <g transform="translate(22 24)">
    <path d="M58 0 114 19v50c0 32-22 55-56 65C24 124 2 101 2 69V19Z"
          fill="url(#shieldFill)" stroke="url(#shieldEdge)" stroke-width="3" stroke-linejoin="round"/>
    <g fill="none" stroke="#00ff41" stroke-linecap="square" stroke-width="7">
      <path d="M26 44 50 64 26 84"/>
      <path d="M62 84h26"/>
    </g>
  </g>

  <!-- Testi -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="158" y="52" fill="#4a5a50" font-size="14" letter-spacing="3.2">FONDAZIONE</text>
    <text x="156" y="86" fill="#12351f" font-size="29" font-weight="bold" letter-spacing="0.8">FASSICOMO</text>
    <rect x="158" y="97" width="204" height="2" fill="#00a52b" opacity="0.6"/>
    <text x="156" y="124" fill="#2c7444" font-size="16" font-weight="bold" letter-spacing="2.6">SCUOLA FASSICOMO</text>
    <text x="158" y="145" fill="#7b9184" font-size="10.5" letter-spacing="1.8">ISTRUZIONE E FORMAZIONE</text>
  </g>
</svg>
