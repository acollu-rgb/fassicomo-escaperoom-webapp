# =============================================================================
#  Nginx — Escape Room Fassicomo
#  Installato come /etc/nginx/sites-available/escaperoom.conf e linkato in
#  sites-enabled. Ascolta solo sulla porta 8002 e non tocca altri siti.
# =============================================================================

# Gunicorn ascolta su 127.0.0.1:8003; Nginx è l'unico a rispondere sulla 8002
upstream escaperoom_gunicorn {
    server 127.0.0.1:8003;
    keepalive 8;
}

server {
    listen 8002;
    listen [::]:8002;
    server_name __SERVER_NAME__;

    client_max_body_size 10M;
    keepalive_timeout 65;

    access_log /var/log/nginx/escaperoom.access.log;
    error_log  /var/log/nginx/escaperoom.error.log;

    # file statici raccolti da collectstatic
    location /static/ {
        alias __DEPLOY_DIR__/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # le pagine del livello 2 sono sotto /static/level2/ (vedi STATICFILES_DIRS)
    location /media/ {
        alias __DEPLOY_DIR__/media/;
        expires 5m;
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://escaperoom_gunicorn;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_redirect off;
    }

    # l'admin non deve essere indicizzato
    location /admin/ {
        proxy_pass http://escaperoom_gunicorn;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
